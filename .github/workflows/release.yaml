name: release-flow

# Manual trigger only: run from Actions tab with a version like v1.2.3
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version - in the form of v1.2.3'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  pkg_name: axum-template
  VERSION: ${{ inputs.version }}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Bundle release
        run: tar -czf ${{ env.pkg_name }}_linux-x86_64.tar.gz -C target/release ${{ env.pkg_name }}
      - name: Upload package to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.pkg_name }}_linux-x86_64.tar.gz
          path: ${{ env.pkg_name }}_linux-x86_64.tar.gz
          retention-days: 1
          overwrite: true

  build-linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        uses: taiki-e/install-action@cross
      - name: Build cross image
        run: ./docker/arm/build.sh
      - name: Build release (aarch64)
        run: cross build --release --target aarch64-unknown-linux-gnu
      - name: Bundle release
        run: tar -czf ${{ env.pkg_name }}_linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release ${{ env.pkg_name }}
      - name: Upload package to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.pkg_name }}_linux-aarch64.tar.gz
          path: ${{ env.pkg_name }}_linux-aarch64.tar.gz
          retention-days: 1
          overwrite: true

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Prepare release
        run: move target/release/${{ env.pkg_name }}.exe .
      - name: Bundle release
        run: Compress-Archive -Path ${{ env.pkg_name }}.exe -DestinationPath ${{ env.pkg_name }}_windows.zip
      - name: Upload package to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.pkg_name }}_windows.zip
          path: ${{ env.pkg_name }}_windows.zip
          retention-days: 1
          overwrite: true

  upload-release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-linux-aarch64
      - build-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
      - name: Upload Linux x86_64 release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.pkg_name }}_linux-x86_64.tar.gz
          asset_name: ${{ env.pkg_name }}_${{ env.VERSION }}_linux-x86_64.tar.gz
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true
      - name: Upload Linux aarch64 release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.pkg_name }}_linux-aarch64.tar.gz
          asset_name: ${{ env.pkg_name }}_${{ env.VERSION }}_linux-aarch64.tar.gz
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true
      - name: Upload Windows release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.pkg_name }}_windows.zip
          asset_name: ${{ env.pkg_name }}_${{ env.VERSION }}_windows.zip
          release_name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          overwrite: true
