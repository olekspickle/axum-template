{% for project in projects %}
                            <tr>
                                <td class="px-6 py-4">{{ project.title }}</td>
                                <td class="px-6 py-4">{{ project.category }}</td>
                                <td class="px-6 py-4">
                                    {% if project.featured %}
                                    <span class="text-green-600">Yes</span>
                                    {% else %}
                                    <span class="text-gray-400">No</span>
                                    {% endif %}
                                </td>
                                <td class="px-6 py-4 space-x-2">
                                    <a href="/admin/projects/{{ project.slug }}" class="text-indigo-600 hover:underline">Edit</a>
                                    <button type="button" hx-delete="/api/v1/projects/{{ project.id }}" hx-confirm="Delete this project?" hx-swap="none" hx-on::after-request="if(event.detail.successful){this.closest('tr').remove()}else{alert('Delete failed: ' + event.detail.xhr.status)}" class="text-red-600 hover:underline">Delete</button>
                                </td>
                            </tr>
                            {% else %}
                            <tr><td colspan="4" class="px-6 py-4 text-gray-500">No matching projects</td></tr>
                            {% endfor %}
