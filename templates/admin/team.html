<!DOCTYPE html>
<html>
    {% include "../head.html" %}

    <body>
        <div class="flex min-h-screen">
            <aside class="w-64 bg-gray-800 text-white p-6">
                <h2 class="text-xl font-bold mb-8">Admin Panel</h2>
                <nav class="space-y-4">
                    <a href="/admin" class="block py-2 px-4 rounded hover:bg-gray-700">Dashboard</a>
                    <a href="/admin/projects" class="block py-2 px-4 rounded hover:bg-gray-700">Projects</a>
                    <a href="/admin/posts" class="block py-2 px-4 rounded hover:bg-gray-700">Posts</a>
                    <a href="/admin/team" class="block py-2 px-4 rounded hover:bg-gray-700">Team</a>
                    <a href="/" class="block py-2 px-4 rounded hover:bg-gray-700 text-gray-400">View Site</a>
                    <button type="button" hx-post="/admin/logout" class="block w-full text-left py-2 px-4 rounded hover:bg-gray-700 text-gray-400">Logout</button>
                </nav>
            </aside>

            <main class="flex-1 p-8">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-bold">Team Members</h1>
                </div>

                <div class="mb-8">
                    <h2 class="text-xl font-semibold mb-4">Add New Member</h2>
                    <form method="POST" class="space-y-4 max-w-xl">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" name="name" placeholder="Name" required
                                class="px-4 py-2 border border-gray-300 rounded-lg">
                            <input type="text" name="role" placeholder="Role" required
                                class="px-4 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <textarea name="bio" placeholder="Bio" rows="2" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
                        <input type="url" name="photo_url" placeholder="Photo URL"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <div class="grid grid-cols-3 gap-4">
                            <input type="url" name="github_url" placeholder="GitHub URL"
                                class="px-4 py-2 border border-gray-300 rounded-lg">
                            <input type="url" name="twitter_url" placeholder="Twitter URL"
                                class="px-4 py-2 border border-gray-300 rounded-lg">
                            <input type="url" name="linkedin_url" placeholder="LinkedIn URL"
                                class="px-4 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
                            Add Team Member
                        </button>
                    </form>
                </div>

                {% if !members.is_empty() %}
                <div class="mb-4">
                    <input type="search" name="q" placeholder="Search team members..."
                        hx-get="/admin/team/search" hx-trigger="input changed delay:300ms"
                        hx-target="#team-tbody" hx-swap="innerHTML"
                        class="w-full max-w-md px-4 py-2 border border-gray-300 rounded-lg"
                        autocomplete="off">
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Photo</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="team-tbody" class="divide-y divide-gray-200">
                            {% include "_team-rows.html" %}
                        </tbody>
                    </table>
                </div>
                {% else %}
                <p class="text-gray-600">No team members yet.</p>
                {% endif %}
            </main>
        </div>
    </body>
</html>
