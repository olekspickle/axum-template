<!DOCTYPE html>
<html>
    {% include "../head.html" %}

    <body>
        <div class="flex min-h-screen">
            {% include "_sidebar.html" %}

            <main class="flex-1 p-8">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-bold">Team Members</h1>
                </div>

                <div class="mb-8">
                    <h2 class="text-xl font-semibold mb-4">Add New Member</h2>
                    <form method="POST" class="space-y-4 max-w-xl">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" name="name" id="name-input" placeholder="Name" required
                                class="px-4 py-2 border border-gray-300 rounded-lg">
                            <input type="text" name="role" placeholder="Role" required
                                class="px-4 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <textarea name="bio" placeholder="Bio" rows="2" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
                        <div data-image-field data-slug-from="#name-input">
                            <input type="text" name="photo_url" placeholder="Photo: paste a URL or upload" inputmode="url"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <div data-avatar-editor class="avatar-editor" hidden>
                            <div class="avatar avatar-stage"><img alt="" draggable="false"></div>
                            <div class="avatar-controls">
                                <label>Zoom <input type="range" class="avatar-zoom" min="1" max="4" step="0.01" value="1"></label>
                                <p class="avatar-hint">Drag the photo to reposition it.</p>
                            </div>
                            <input type="hidden" name="photo_w" value="">
                            <input type="hidden" name="photo_l" value="0">
                            <input type="hidden" name="photo_t" value="0">
                        </div>
                        <div data-links-editor>
                            <input type="hidden" name="links" value="[]">
                            <div class="links-rows"></div>
                            <button type="button" class="links-add">+ Add link</button>
                            <template>
                                <div class="link-row">
                                    <select>{% for (value, label, _) in platforms %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select>
                                    <input type="text" placeholder="https://..." inputmode="url">
                                    <button type="button" class="link-remove" title="Remove link">&times;</button>
                                </div>
                            </template>
                        </div>
                        <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
                            Add Team Member
                        </button>
                    </form>
                </div>

                {% if !members.is_empty() %}
                <div class="mb-4">
                    <input type="search" name="q" placeholder="Search team members..."
                        hx-get="/admin/team/search" hx-trigger="input changed delay:300ms"
                        hx-target="#team-tbody" hx-swap="innerHTML"
                        class="w-full max-w-md px-4 py-2 border border-gray-300 rounded-lg"
                        autocomplete="off">
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Photo</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="team-tbody" class="divide-y divide-gray-200">
                            {% include "_team-rows.html" %}
                        </tbody>
                    </table>
                </div>
                {% else %}
                <p class="text-gray-600">No team members yet.</p>
                {% endif %}
            </main>
        </div>
        <link rel="stylesheet" href="/static/css/admin-fields.css">
        <script src="/static/js/admin-fields.js"></script>
    </body>
</html>
