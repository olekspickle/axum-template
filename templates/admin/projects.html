<!DOCTYPE html>
<html>
    {% include "../head.html" %}

    <body>
        <div class="flex min-h-screen">
            {% include "_sidebar.html" %}

            <main class="flex-1 p-8">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-bold">Projects</h1>
                    <a href="/admin/projects/new" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Add New Project</a>
                </div>

                {% if !projects.is_empty() %}
                <div class="mb-4">
                    <input type="search" name="q" placeholder="Search projects..."
                        hx-get="/admin/projects/search" hx-trigger="input changed delay:300ms"
                        hx-target="#projects-tbody" hx-swap="innerHTML"
                        class="w-full max-w-md px-4 py-2 border border-gray-300 rounded-lg"
                        autocomplete="off">
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Featured</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="projects-tbody" class="divide-y divide-gray-200">
                            {% include "_project-rows.html" %}
                        </tbody>
                    </table>
                </div>
                {% else %}
                <p class="text-gray-600">No projects yet.</p>
                {% endif %}
            </main>
        </div>

        </body>
</html>
