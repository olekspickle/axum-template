<!DOCTYPE html>
<html>
    {% include "../head.html" %}

    <body>
        <div class="flex min-h-screen">
            {% include "_sidebar.html" %}

            <main class="flex-1 p-8">
                <h1 class="text-3xl font-bold mb-8">Edit Team Member</h1>

                <form method="POST" action="/admin/team/{{ member.id }}" class="space-y-4 max-w-xl">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" name="name" id="name-input" placeholder="Name" value="{{ member.name }}" required
                            class="px-4 py-2 border border-gray-300 rounded-lg">
                        <input type="text" name="role" placeholder="Role" value="{{ member.role }}" required
                            class="px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <textarea name="bio" placeholder="Bio" rows="3" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg">{{ member.bio }}</textarea>
                    <div data-image-field data-slug-from="#name-input">
                        <input type="text" name="photo_url" placeholder="Photo: paste a URL or upload" inputmode="url"
                            value="{% if let Some(url) = member.photo_url %}{{ url }}{% endif %}"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <div data-avatar-editor class="avatar-editor" hidden>
                        <div class="avatar avatar-stage"><img alt="" draggable="false"></div>
                        <div class="avatar-controls">
                            <label>Zoom <input type="range" class="avatar-zoom" min="1" max="4" step="0.01" value="1"></label>
                            <p class="avatar-hint">Drag the photo to reposition it.</p>
                        </div>
                        <input type="hidden" name="photo_w" value="{% if let Some(w) = member.photo.w %}{{ w }}{% endif %}">
                        <input type="hidden" name="photo_l" value="{{ member.photo.l }}">
                        <input type="hidden" name="photo_t" value="{{ member.photo.t }}">
                    </div>
                    <div data-links-editor>
                        <input type="hidden" name="links" value="{{ member.links_json() }}">
                        <div class="links-rows"></div>
                        <button type="button" class="links-add">+ Add link</button>
                        <template>
                            <div class="link-row">
                                <select>{% for (value, label, _) in platforms %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select>
                                <input type="text" placeholder="https://..." inputmode="url">
                                <button type="button" class="link-remove" title="Remove link">&times;</button>
                            </div>
                        </template>
                    </div>
                    <div class="flex items-center gap-4">
                        <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">Save</button>
                        <a href="/admin/team" class="text-gray-600 hover:underline">Cancel</a>
                    </div>
                </form>
            </main>
        </div>
        <link rel="stylesheet" href="/static/css/admin-fields.css">
        <script src="/static/js/admin-fields.js"></script>
    </body>
</html>
