[server]
host = "0.0.0.0"
port = 7777
# Set to true only when a proxy you control (nginx, cloudflared) sits in front,
# so X-Real-IP/X-Forwarded-For can be trusted for rate limiting. This also tells
# the app the proxy terminates TLS, enabling Secure cookies and HSTS.
trusted_proxy = false

[auth]
token_ttl = 3600
admin_username = "admin"
# No password here on purpose: the ADMIN_PASSWORD env var is the only source.
# The server refuses to start without it.

[db]
path = "posts.db"

[db.surreal]
url = "ws://localhost:8000"
username = "root"
# Dev fallback only. In production set the SURREAL_PASSWORD env var.
password = "root"
namespace = "studio"
name = "portfolio"

[site]
name = "Studio Name"
tagline = "We create interactive experiences"
default_language = "en"

[site.socials]
twitter = "https://twitter.com/yourusername"
bluesky = "https://bsky.app/profile/yourusername"
instagram = "https://instagram.com/yourusername"
github = "https://github.com/yourusername"
linkedin = "https://linkedin.com/in/yourusername"

[zip]
path = "my.zip"
file = "my.txt"

